<div class="feed-header d-flex align-items-center justify-content-between gap-4 mb-2 flex-wrap">
  <div class="col-12 col-md-6">
    <app-search-bar></app-search-bar>
  </div>
  <div class="d-none d-md-flex align-content-center">
    <button
      class="sort-btn fw-medium d-flex align-items-center gap-2"
      (click)="cycleSort()"
      title="Change sort order"
    >
      <i class="bi bi-arrow-down-up"></i>
      Sort: {{ currentSort }}
    </button>
  </div>
</div>
