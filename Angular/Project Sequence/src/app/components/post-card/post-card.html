<div
  class="post-card"
  [class.vertical]="layout === 'vertical'"
  [class.horizontal]="layout === 'horizontal'"
>
  <app-post-card-img [src]="post.image" [alt]="post.title" [layout]="layout"> </app-post-card-img>

  <div>
    <app-post-card-content [post]="post"> </app-post-card-content>

    <app-post-card-actions [post]="post" [layout]="layout"> </app-post-card-actions>
  </div>
</div>
