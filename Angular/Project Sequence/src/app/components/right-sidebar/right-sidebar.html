<aside class="right-sidebar d-flex flex-column gap-3">
  <section class="sidebar-panel">
    <div class="sidebar-label text-uppercase fw-bold">Trending Tags</div>
    <div class="tags-cloud">
      <span *ngFor="let tag of trendingTags" class="tag-hashtag">{{ tag }}</span>
    </div>
  </section>

  <section class="sidebar-panel">
    <div class="sidebar-label text-uppercase fw-bold">Weekly Leaders</div>
    <div class="leaders-list d-flex flex-column gap-2">
      <div class="leader-item d-flex align-items-start justify-content-between gap-3" *ngFor="let leader of weeklyLeaders">
        <div class="leader-info d-flex align-items-start gap-3 min-w-0">
          <div class="leader-avatar">{{ leader.initial }}</div>
          <div class="leader-details min-w-0">
            <div class="leader-name text-truncate">{{ leader.name }}</div>
            <div class="leader-stats d-flex flex-wrap gap-2">
              <span>{{ leader.posts }} posts</span>
              <span class="trend-up">{{ leader.upvotes }} upvotes</span>
            </div>
          </div>
        </div>
        <div class="upvote-count">{{ leader.upvotes }}</div>
      </div>
    </div>
  </section>
</aside>
