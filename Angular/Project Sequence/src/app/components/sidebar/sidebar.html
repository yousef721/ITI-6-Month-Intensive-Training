<aside class="left-sidebar d-flex flex-column">

  <!-- Navigation -->
  <div class="sidebar-section">
    <div class="sidebar-label">Navigation</div>

    @for (item of menuItems; track $index) {
      <div
        class="sidebar-link d-flex align-items-center"
        (click)="setActive(item.name)"
        [class.active]="activeItem === item.name"
      >
        <span class="sidebar-icon">{{ item.icon }}</span>
        <span class="flex-grow-1">{{ item.name }}</span>
        @if(item.count)
        {
          <span class="sidebar-count ms-auto">
            {{ item.count }}
          </span>
        }
      </div>
    }

  </div>

  <div class="sidebar-divider"></div>

  <!-- Topics -->
  <div class="sidebar-section">
    <div class="sidebar-label">Topics</div>

    @for (topic of topics; track $index) {
      <div
        class="sidebar-link d-flex align-items-center"
        (click)="setActive(topic.name)"
        [class.active]="activeItem === topic.name"
      >
        <span class="sidebar-icon">{{ topic.icon }}</span>
        <span class="flex-grow-1">{{ topic.name }}</span>
        @if(topic.count)
        {
          <span class="sidebar-count ms-auto">
            {{ topic.count }}
          </span>
        }
      </div>
    }
    
  </div>

</aside>
