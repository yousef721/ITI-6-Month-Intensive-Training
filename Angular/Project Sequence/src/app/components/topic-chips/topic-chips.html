<div class="topic-chips d-flex align-items-center gap-3 py-2 mb-4 overflow-x-auto flex-nowrap">
  @for (tab of tabs; track $index) {
    <div
      class="chip btn btn-outline text-nowrap"
      [class.active]="tab.active"
      (click)="selectTab(tab)"
    >
      {{ tab.label }}
    </div>
  }
</div>
