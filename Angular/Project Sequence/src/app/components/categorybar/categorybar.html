<div class="cat-bar d-flex align-items-center gap-3 py-2 overflow-x-auto flex-nowrap ">
  @for(tab of tabs; track $index)
  {
    <div
      class="cat-tab px-3 py-2 rounded-pill fw-500 text-nowrap border border-transparent"
      [class.active]="tab.active"
      (click)="selectTab(tab)"
    >
      {{ tab.label }}
    </div>
  }
</div>
