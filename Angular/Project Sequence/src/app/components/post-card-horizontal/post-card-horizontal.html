@for (post of posts; track $index) {
  <article class="post-card d-flex gap-3">
    <!-- Upvote -->
    <div class="post-card-left d-flex flex-column align-items-center">
      <div
        class="upvote-btn d-flex flex-column align-items-center"
        [class.voted]="post.voted"
        (click)="toggleVote(post)"
      >
        <span class="upvote-arrow">▲</span>

        <span class="upvote-count">
          {{ post.voted ? post.upvotes + 1 : post.upvotes }}
        </span>
      </div>
    </div>

    <!-- Content -->
    <div class="post-card-body flex-grow-1">
      <div class="post-source d-flex align-items-center gap-2 flex-wrap">
        <div class="source-favicon" [style.background]="post.sourceColor">
          {{ post.sourceInitial }}
        </div>

        <span class="source-name">
          {{ post.sourceName }}
        </span>

        <span class="source-dot"></span>

        <span class="post-time">
          {{ post.time }}
        </span>

        <span class="read-badge">
          {{ post.readTime }}
        </span>
      </div>

      <div class="post-title">
        {{ post.title }}
      </div>

      <div class="post-desc">
        {{ post.description }}
      </div>

      <div class="post-actions d-flex gap-2 flex-wrap">
        <button class="post-action">💬 {{ post.comments }} comments</button>

        <button class="post-action">🔖 Save</button>

        <button class="post-action">↗️ Share</button>
      </div>
    </div>

    <!-- Thumbnail -->
    <img class="post-card-thumb" [src]="post.images" alt="" loading="lazy" />
  </article>
}
