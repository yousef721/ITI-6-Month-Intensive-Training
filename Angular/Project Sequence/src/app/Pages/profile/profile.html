<div class="container py-4 py-lg-5">
  <div class="row g-4">
    <!-- User Card -->
    <div class="col-lg-4">
      <app-user-card [user]="currentUser"></app-user-card>
    </div>

    <!-- Content -->
    <div class="col-lg-8">
      <!-- Stats -->
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="app-card text-center p-3 h-100">
            <h3 class="mb-1 text-accent fw-bold">
              {{ stats.postsSaved }}
            </h3>
            <small class="text-muted"> Posts Saved </small>
          </div>
        </div>

        <div class="col-md-4">
          <div class="app-card text-center p-3 h-100">
            <h3 class="mb-1 text-accent fw-bold">
              {{ stats.upvotesGiven | number: '1.0-0' }}
            </h3>
            <small class="text-muted"> Upvotes Given </small>
          </div>
        </div>

        <div class="col-md-4">
          <div class="app-card text-center p-3 h-100">
            <h3 class="mb-1 text-accent fw-bold">
              {{ stats.comments }}
            </h3>
            <small class="text-muted"> Comments </small>
          </div>
        </div>
      </div>

      <!-- Saved Posts -->
      <div class="app-panel p-4 mb-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h5 class="mb-0 fw-bold">Saved Posts</h5>
        </div>

        @for (post of myPosts; track post.id) {
          @if (post.saved) {
            <div class="d-flex gap-3 py-3 border-bottom">
              <img [src]="post.image" [alt]="post.title" class="rounded" width="90" height="70" />

              <div class="flex-grow-1">
                <div class="fw-bold mb-1">
                  {{ post.title }}
                </div>

                <div class="text-muted small mb-2">
                  {{ post.description }}
                </div>
              </div>
            </div>
          }
        }
      </div>

      <!-- Settings -->
      <div class="app-panel p-4">
        <h5 class="fw-bold mb-4">Account Settings</h5>

        <div class="mb-3">
          <label class="form-label"> Display Name </label>

          <input class="form-control" [(ngModel)]="settings.displayName" />
        </div>

        <div class="mb-3">
          <label class="form-label"> Email </label>

          <input class="form-control" [(ngModel)]="settings.email" />
        </div>

        <div class="mb-4">
          <label class="form-label"> Bio </label>

          <textarea rows="3" class="form-control" [(ngModel)]="settings.bio"></textarea>
        </div>

        <button class="btn btn-primary" (click)="saveProfile()">Save Changes</button>
      </div>
    </div>
  </div>
</div>
