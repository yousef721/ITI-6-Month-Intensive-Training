<section class="py-5">
  <div class="container">
    <div class="mb-4">
      <div class="section-label">Latest Content</div>
      <div class="section-title">Today's top picks</div>
    </div>

    <div class="row g-4">
      @for (post of posts; track post.id) {
        <div class="col-md-4">
          <app-post-card [post]="post" layout="vertical"> </app-post-card>
        </div>
      }
    </div>

    <div class="text-center mt-5">
      <button class="btn btn-outline px-4 py-3" routerLink="/posts">
        Show More Posts <i class="bi bi-arrow-right ms-2"></i>
      </button>
    </div>
  </div>
</section>
