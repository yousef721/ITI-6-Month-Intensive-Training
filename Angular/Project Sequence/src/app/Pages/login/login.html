<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <!-- Header -->
      <div class="login-header text-center mb-4">
        <div class="login-logo d-inline-flex align-items-center gap-2 mb-3">
          <span class="brand-dot rounded-circle d-inline-block"></span>
          <span class="fw-bold">DevFeed</span>
        </div>
        <h1 class="login-title mb-1">Welcome back</h1>
        <p class="login-subtitle">Sign in to your DevFeed account</p>
      </div>

      <!-- Form -->
      <form class="login-form">
        <!-- Email Field -->
        <div class="form-group mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <!-- Password Field -->
        <div class="form-group mb-2">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="••••••••"
            required
          />
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="d-flex justify-content-between align-items-center mb-4 small">
          <label class="form-check d-flex align-items-center gap-2">
            <input type="checkbox" class="form-check-input" />
            <span>Remember me</span>
          </label>
          <a href="#" class="text-decoration-none text-accent">Forgot password?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
          Sign in
        </button>

        <!-- Divider -->
        <div class="divider-line text-center mb-3">
          <span>or continue with</span>
        </div>

        <!-- Social Login -->
        <div class="social-login d-flex gap-2 mb-4">
          <button type="button" class="btn btn-outline flex-grow-1">
            <i class="bi bi-github"></i> GitHub
          </button>
          <button type="button" class="btn btn-outline flex-grow-1">
            <i class="bi bi-google"></i> Google
          </button>
        </div>

        <!-- Sign Up Link -->
        <p class="text-center small text-muted">
          Don't have an account?
          <a routerLink="/signup" class="text-decoration-none text-accent fw-semibold">Sign up for free</a>
        </p>
      </form>
    </div>
  </div>
</div>
