<div class="signup-page">
  <div class="signup-container">
    <div class="signup-card">
      <!-- Header -->
      <div class="signup-header text-center mb-4">
        <div class="signup-logo d-inline-flex align-items-center gap-2 mb-3">
          <span class="brand-dot rounded-circle d-inline-block"></span>
          <span class="fw-bold">DevFeed</span>
        </div>
        <h1 class="signup-title mb-1">Join DevFeed</h1>
        <p class="signup-subtitle">Create an account and start discovering amazing developer content</p>
      </div>

      <!-- Form -->
      <form class="signup-form">
        <!-- Name Field -->
        <div class="form-group mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="John Doe"
            required
          />
        </div>

        <!-- Email Field -->
        <div class="form-group mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <!-- Password Field -->
        <div class="form-group mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="••••••••"
            required
          />
          <small class="text-muted">At least 8 characters with uppercase and numbers</small>
        </div>

        <!-- Terms -->
        <div class="form-check mb-4 d-flex align-items-flex-start gap-2">
          <input type="checkbox" class="form-check-input mt-1" id="terms" required />
          <label for="terms" class="form-check-label text-muted small">
            I agree to the <a href="#" class="text-accent">Terms of Service</a> and
            <a href="#" class="text-accent">Privacy Policy</a>
          </label>
        </div>

        <!-- Sign Up Button -->
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
          Create Account
        </button>

        <!-- Divider -->
        <div class="divider-line text-center mb-3">
          <span>or sign up with</span>
        </div>

        <!-- Social Signup -->
        <div class="social-signup d-flex gap-2 mb-4">
          <button type="button" class="btn btn-outline flex-grow-1">
            <i class="bi bi-github"></i> GitHub
          </button>
          <button type="button" class="btn btn-outline flex-grow-1">
            <i class="bi bi-google"></i> Google
          </button>
        </div>

        <!-- Sign In Link -->
        <p class="text-center small text-muted">
          Already have an account?
          <a routerLink="/login" class="text-decoration-none text-accent fw-semibold">Sign in</a>
        </p>
      </form>
    </div>
  </div>
</div>
