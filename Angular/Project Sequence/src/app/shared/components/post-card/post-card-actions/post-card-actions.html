@if (layout === 'horizontal') {
<div class="post-row-footer d-flex align-items-center flex-nowrap shrink-0 gap-2">
  <button type="button" class="app-action post-action-btn d-inline-flex align-items-center gap-1"
    [class.is-voted]="post.voted" (click)="toggleVote(); $event.stopPropagation()">
    <i class="bi" [class.bi-triangle-fill]="post.voted" [class.bi-triangle]="!post.voted"></i>
    <span>{{ post.upvotes }}</span>
  </button>

  <button type="button" class="app-action post-action-btn d-inline-flex align-items-center gap-1">
    <i class="bi bi-chat"></i>
    <span>{{ post.commentsCount }}</span>
  </button>

  <button type="button" class="app-action post-action-btn d-inline-flex align-items-center gap-1"
    [class.active]="post.saved" (click)="toggleSave(); $event.stopPropagation()">
    <i class="bi" [class.bi-bookmark-fill]="post.saved" [class.bi-bookmark]="!post.saved"></i>
    <span>{{ post.saved ? 'Saved' : 'Save' }}</span>
  </button>

  <button type="button" class="app-action post-action-btn d-inline-flex align-items-center gap-1">
    <i class="bi bi-share"></i>
    <span>Share</span>
  </button>
</div>
} @else {
<div class="post-row-footer d-flex align-items-center gap-3 small text-secondary">
  <button type="button" class="app-action post-action-btn d-inline-flex align-items-center gap-1"
    [class.is-voted]="post.voted" (click)="toggleVote(); $event.stopPropagation()">
    <i class="bi" [class.bi-triangle-fill]="post.voted" [class.bi-triangle]="!post.voted"></i>
    <span>{{ post.upvotes }}</span>
  </button>

  <button type="button" class="app-action post-action-btn d-inline-flex align-items-center gap-1">
    <i class="bi bi-chat"></i>
    <span>{{ post.commentsCount }}</span>
  </button>

  <button type="button" class="app-action post-action-btn ms-auto d-inline-flex align-items-center gap-1"
    [class.active]="post.saved" (click)="toggleSave(); $event.stopPropagation()">
    <i class="bi" [class.bi-bookmark-fill]="post.saved" [class.bi-bookmark]="!post.saved"></i>
    <span>{{ post.saved ? 'Saved' : 'Save' }}</span>
  </button>
</div>
}
