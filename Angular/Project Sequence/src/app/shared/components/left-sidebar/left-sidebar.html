<aside class="left-sidebar d-flex flex-column gap-3">
  <section class="app-panel">
    <div class="panel-label px-3 pt-3 pb-2">Navigation</div>

    <div class="sidebar-list d-flex flex-column gap-1">
      @for (item of menuItems; track $index) {
        <button
          type="button"
          class="app-link-row sidebar-link d-flex align-items-center gap-2 w-100 px-3 py-2"
          (click)="setActive(item.name)"
          [class.active]="activeItem === item.name"
        >
          <span class="sidebar-icon text-center">{{ item.icon }}</span>
          <span class="sidebar-text flex-grow-1 text-start">{{ item.name }}</span>
          @if (item.count) {
            <span class="app-badge app-badge-sm">
              {{ item.count }}
            </span>
          }
        </button>
      }
    </div>
  </section>

  <section class="app-panel">
    <div class="panel-label px-3 pt-3 pb-2">Topics</div>

    <div class="sidebar-list d-flex flex-column gap-1">
      @for (topic of topics; track $index) {
        <button
          type="button"
          class="app-link-row sidebar-link d-flex align-items-center gap-2 w-100 px-3 py-2"
          (click)="setActive(topic.name)"
          [class.active]="activeItem === topic.name"
        >
          <span class="sidebar-icon text-center">{{ topic.icon }}</span>
          <span class="sidebar-text flex-grow-1 text-start">{{ topic.name }}</span>
          @if (topic.count) {
            <span class="app-badge app-badge-sm">
              {{ topic.count }}
            </span>
          }
        </button>
      }
    </div>
  </section>
</aside>
