<div class="app-panel p-3 d-flex align-items-center justify-content-between">
  <div class="col-12 col-md-6">
    <app-search-bar (searchChange)="onSearch($event)"></app-search-bar>
  </div>

  <div class="d-none d-md-block">
    <button class="sort-btn d-flex align-items-center gap-2 py-2 px-3" (click)="cycleSort()" title="Change sort order">
      <i class="bi bi-arrow-down-up"></i>
      Sort: {{ currentSort }}
    </button>
  </div>
</div>
