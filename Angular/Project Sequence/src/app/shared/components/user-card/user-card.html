<div class="app-card app-card-hover text-center p-4">
  <div class="app-avatar mx-auto mb-3 d-flex align-items-center justify-content-center">
    {{ user.avatarInitial }}
  </div>

  <div class="profile-name mb-1">
    {{ user.name }}
  </div>

  <div class="profile-email mb-3">
    {{ user.email }}
  </div>

  <div class="profile-bio mb-4">
    {{ user.bio }}
  </div>

  <div class="d-grid gap-2">
    <a href="https://github.com/yousef721" target="_blank" rel="noopener noreferrer" class="btn btn-github">
      <i class="bi bi-github me-2"></i>
      GitHub
    </a>

    <a href="https://www.linkedin.com/in/yousef-abdullah-076ba0249/" target="_blank" rel="noopener noreferrer"
      class="btn btn-linkedin">
      <i class="bi bi-linkedin me-2"></i>
      LinkedIn
    </a>

    <button class="btn btn-outline-secondary">
      <i class="bi bi-share me-2"></i>
      Share Profile
    </button>
  </div>
</div>
