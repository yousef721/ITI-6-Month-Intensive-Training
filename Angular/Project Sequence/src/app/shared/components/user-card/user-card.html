<div class="profile-card text-center p-4">
  <!-- Avatar -->
  <div class="profile-avatar mx-auto mb-3 d-flex align-items-center justify-content-center">
    {{ user.avatarInitial }}
  </div>

  <!-- Name / Email -->
  <div class="profile-name mb-1">
    {{ user.name }}
  </div>

  <div class="profile-email text-muted mb-3">
    {{ user.email }}
  </div>

  <!-- Badges -->
  <div class="d-flex justify-content-center gap-2 flex-wrap mb-3">
    @for (badge of user.badges; track badge) {
      <span class="profile-badge">
        {{ badge }}
      </span>
    }
  </div>

  <!-- Bio -->
  <div class="profile-bio mb-4">
    {{ user.bio }}
  </div>

  <!-- Actions -->
  <div class="d-grid gap-2">
    <button class="btn btn-primary">Edit Profile</button>
    <button class="btn btn-outline">Share Profile</button>
  </div>
</div>
